apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps-sample-python-app
  namespace: argocd
spec:
  description: Argo CD project for the sample Python application
  sourceRepos:
    - https://github.com/pandeyaws/sample-python-app.git
    - https://github.com/pandeyaws/sample-python-app-argocd.git
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: dev-sample-python-app
      server: https://kubernetes.default.svc
    - namespace: prd-sample-python-app
      server: https://scf-aks-dev-mms8s86a.hcp.eastus.azmk8s.io:443
  roles:
    - name: apps-sample-python-app-admin
      description: Admin role for the sample Python application project
      policies:
        - p, proj:apps-sample-python-app:apps-sample-python-app-admin, applications, *, apps-sample-python-app/*, allow
        - p, proj:apps-sample-python-app:apps-sample-python-app-admin, projects, *, apps-sample-python-app, allow
      groups:
        - 8363032c-dde1-48e7-a76e-af924b4762d2    
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: Application 
metadata:
  name: apps-sample-python-app
  namespace: argocd   
spec:
  project: apps-sample-python-app
  source:
    repoURL: https://github.com/pandeyaws/sample-python-app-argocd.git
    targetRevision: master
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true  
    syncOptions:
      - CreateNamespace=true
      - serverside-apply=true  
